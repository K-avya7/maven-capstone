resources:
  jobs:
    maven_market_etl_workflow:
      name: Maven_Market_ETL_Orchestrator
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"

      job_clusters:
        - job_cluster_key: ingestion_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "Standard_D4s_v5"
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: "singleNode"
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: "SingleNode"
              project: "maven_market"

      tasks:
        - task_key: ingest_batch_csv
          job_cluster_key: ingestion_cluster
          spark_python_task:
            python_file: ../src/bronze/ingest_csv.py

        - task_key: ingest_nosql_mongodb
          job_cluster_key: ingestion_cluster
          spark_python_task:
            python_file: ../src/bronze/ingest_mongodb.py

        - task_key: ingest_kafka_stream
          job_cluster_key: ingestion_cluster
          spark_python_task:
            python_file: ../src/bronze/ingest_kafka.py

        - task_key: execute_silver_dlt
          depends_on:
            - task_key: ingest_batch_csv
            - task_key: ingest_nosql_mongodb
            - task_key: ingest_kafka_stream
          pipeline_task:
            pipeline_id: ${resources.pipelines.maven_market_silver_dlt.id}

        - task_key: execute_gold_dlt
          depends_on:
            - task_key: execute_silver_dlt
          pipeline_task:
            pipeline_id: ${resources.pipelines.maven_market_gold_dlt.id}