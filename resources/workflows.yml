resources:
  jobs:
    maven_market_etl_workflow:
      name: Maven_Market_ETL_Orchestrator
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"

      environments:
        - environment_key: default
          spec:
            environment_version: "1"
            dependencies:
              - pymongo
              - pandas

      tasks:
        - task_key: ingest_batch_csv
          environment_key: default
          spark_python_task:
            python_file: ../src/bronze/ingest_csv.py

        - task_key: ingest_nosql_mongodb
          environment_key: default
          notebook_task:
            notebook_path: /Workspace/Kafka_ingestion/Maven_Market/1.MongoDB Ingestion/mongodb_Ingestion

        - task_key: ingest_kafka_stream
          environment_key: default
          notebook_task:
            notebook_path: /Workspace/Kafka_ingestion/01_ingest_kafka_orders

        - task_key: execute_silver_dlt
          depends_on:
            - task_key: ingest_batch_csv
            - task_key: ingest_nosql_mongodb
            - task_key: ingest_kafka_stream
          pipeline_task:
            pipeline_id: ${resources.pipelines.maven_market_silver_dlt.id}

        - task_key: execute_gold_dlt
          depends_on:
            - task_key: execute_silver_dlt
          pipeline_task:
            pipeline_id: ${resources.pipelines.maven_market_gold_dlt.id}