catalog: "maven_catalog"
schemas:
  bronze: "bronze"
  silver: "silver"
  gold: "gold"
  audit: "audit"

storage:
  root_path: "abfss://uc-root@mavenstorageacc.dfs.core.windows.net"
  checkpoint_path: "abfss://uc-root@mavenstorageacc.dfs.core.windows.net/checkpoints"

kafka:
  bootstrap_servers: "pkc-w77k7w.centralus.azure.confluent.cloud:9092"
  secret_scope: "maven-secrets"
  api_key_secret: "kafka-api-key"
  api_secret_secret: "kafka-api-secret"


mongodb:
  cluster_host: "cluster0.sfjjdaf.mongodb.net"
  database: "mavenmarket"
  user: "maven_admin"
  secret_scope: "maven-secrets"
  secret_key: "mongodb-password"

ingestion:
  batch_csv_entities:
    - folder: "transactions"
      table: "transactions_1997"
    - folder: "regions"
      table: "regions"
    - folder: "stores"
      table: "stores"
    - folder: "calendar"
      table: "calendar"
  mongodb_collections:
    - collection: "products"
      table: "raw_products"
      task_name: "raw_products"
      source_system: "MongoDB Atlas - Products Master"
    - collection: "customers"
      table: "raw_customers"
      task_name: "raw_customers"
      source_system: "MongoDB Atlas - Customers Master"
  kafka_topics:
    - topic: "order-stream"
      table: "raw_orders"
      task_name: "raw_orders"
      checkpoint_path: "/Volumes/maven_catalog/default/my_volume/checkpoints/order_stream_v1/"
      schema: "transaction_date STRING, stock_date STRING, product_id INT, customer_id INT, store_id INT, quantity INT"
    - topic: "inventory-stream"
      table: "raw_inventory"
      task_name: "raw_inventory"
      checkpoint_path: "/Volumes/maven_catalog/default/my_volume/checkpoints/inventory_stream_v1/"
      schema: "inventory_date STRING, store_id INT, product_id INT, stock_on_hand INT, reorder_flag INT"

quality_expectations:
  transactions:
    valid_id: "transaction_id IS NOT NULL"
    valid_quantity: "quantity > 0"
  customers:
    valid_id: "customer_id IS NOT NULL"
  products:
    valid_id: "product_id IS NOT NULL"
  returns:
    valid_quantity: "quantity > 0"