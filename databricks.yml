# This is a Declarative Automation Bundle definition for maven.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: maven
  uuid: e083cbd8-7964-486c-8e70-f29501bf3740

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405609767282066.6.azuredatabricks.net
    variables:
      catalog: dbx_maven_market
      schema: ${workspace.current_user.short_name}
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405609767282066.6.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/kavyaag15@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kavyaag15@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbx_maven_market
      schema: prod
    permissions:
      - user_name: kavyaag15@gmail.com
        level: CAN_MANAGE
